name: Gated demo APK release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
      version_name:
        description: Demo version name, for example 0.2.0-demo.2
        required: true
        type: string
      notes:
        description: Short release notes
        required: true
        type: string
      confirmation:
        description: Type RELEASE CLAYTON DEMO
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clayton-demo-release
  cancel-in-progress: false

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test "$CONFIRMATION" = "RELEASE CLAYTON DEMO"
          test "$VERSION_CODE" -gt 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - run: npm ci
      - run: npm --prefix automation test
      - run: npm test
      - run: npm run build
      - name: Bundle web app into Android assets
        run: rsync -a --delete dist/ android/app/src/main/assets/www/
      - name: Build unsigned release APK
        env:
          SETUPNINJA_FEEDBACK_URL: ${{ vars.SETUPNINJA_FEEDBACK_URL }}
          SETUPNINJA_UPDATE_URL: ${{ vars.SETUPNINJA_UPDATE_URL }}
          SETUPNINJA_VERSION_CODE: ${{ inputs.version_code }}
          SETUPNINJA_VERSION_NAME: ${{ inputs.version_name }}
          SETUPNINJA_UPDATE_PUBLIC_KEY: ${{ vars.SETUPNINJA_UPDATE_PUBLIC_KEY }}
        run: ./android/gradlew -p android lintRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-demo-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  sign-and-publish:
    needs: build-unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: clayton-demo
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-demo-apk
          path: unsigned
      - name: Sign APK with protected Android identity
        env:
          KEYSTORE_BASE64: ${{ secrets.DEMO_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEMO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEMO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEMO_ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/demo.keystore"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          mkdir -p signed
          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned/app-release-unsigned.apk signed/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/demo.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "signed/setupninja-demo-${VERSION_CODE}.apk" \
            signed/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "signed/setupninja-demo-${VERSION_CODE}.apk"
          rm -f "$RUNNER_TEMP/demo.keystore" signed/aligned.apk
      - name: Build signed update bundle
        env:
          DEMO_UPDATE_SIGNING_KEY_PEM: ${{ secrets.DEMO_UPDATE_SIGNING_KEY_PEM }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          NOTES: ${{ inputs.notes }}
          APK_BASE_URL: ${{ vars.DEMO_APK_BASE_URL }}
        run: |
          test -n "$DEMO_UPDATE_SIGNING_KEY_PEM"
          test -n "$APK_BASE_URL"
          TAG="demo-v${VERSION_NAME}-${VERSION_CODE}"
          APK_NAME="setupninja-demo-${VERSION_CODE}.apk"
          APK_URL="${APK_BASE_URL%/}/${TAG}/${APK_NAME}"
          node automation/src/release-cli.mjs \
            --apk "signed/${APK_NAME}" \
            --output bundle \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --apk-url "$APK_URL" \
            --notes "$NOTES"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          TAG="demo-v${VERSION_NAME}-${VERSION_CODE}"
          gh release create "$TAG" bundle/* \
            --latest \
            --title "SetupNinja ${VERSION_NAME}" \
            --notes "$NOTES"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-demo-${{ inputs.version_code }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30
